<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; media-src 'self' file:; style-src 'self'">
  <title>bot-bubble</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="card" hidden>
    <div id="content">
      <p id="web-hint" class="hint">Loading…</p>

      <div id="app-card" class="app">
        <img id="app-avatar" alt="">
        <p><b id="app-name"></b> doesn't have a web client yet, so it opens in its own app.</p>
        <button id="open-app" class="primary">Open <span id="app-name2"></span></button>
      </div>

      <div id="chat">
        <div id="chat-head">
          <b id="chat-title"></b>
          <button id="new-chat" class="label" title="Start a new conversation"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>New chat</button>
        </div>
        <ol id="messages"></ol>
        <div id="pending"></div>
        <form id="composer">
          <button type="button" id="attach" title="Attach files"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <textarea id="input" rows="1"></textarea>
          <button type="submit" id="send" title="Send (Enter)"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </form>
      </div>
    </div>
    <i class="tail"></i>
  </section>

  <section id="pill" hidden>
    <nav id="tabs"></nav>
    <button id="reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></button>
    <button id="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button id="close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <i class="tail"></i>
  </section>

  <div id="dot" title="">
    <svg id="glyph" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="5"/><circle cx="9.5" cy="13" r="1.4"/><circle cx="14.5" cy="13" r="1.4"/><path d="M12 7V4"/></svg>
    <span id="badge" hidden></span>
    <span id="locked" hidden><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
  </div>

  <script src="avatar.js"></script>
  <script src="app.js"></script>
</body>
</html>
